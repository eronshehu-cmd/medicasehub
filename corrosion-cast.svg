<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ccTitle ccDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ccTitle">How a vascular corrosion cast is made</title>
  <desc id="ccDesc">Three stages. First, liquid resin is pushed into the blood vessels of a specimen after the blood has been flushed out. Second, the resin hardens, filling the whole branching network down to the smallest vessels. Third, the surrounding tissue is dissolved away in a strong alkali, including the vessel walls themselves, leaving only the solid shape of the space that was inside them.</desc>

  <defs>
    <marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0413e"/>
    </marker>
    <style>
      .tissue { fill: #f7efe9; stroke: #0a1f33; stroke-width: 2.2; }
      .gone   { fill: none; stroke: #c9cfd5; stroke-width: 2; stroke-dasharray: 6 5; }
      .wall   { stroke: #9aa9b6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .resin  { stroke: #b0413e; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .step   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; fill: #0a1f33; }
      .tag    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #3d6485; }
      .tagr   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #b0413e; }
      .sub    { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #12395c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <!-- reusable vessel geometry -->
  <defs>
    <path id="tree" d="M 8 168 L 62 168
      M 62 168 L 104 126 M 62 168 L 104 210
      M 104 126 L 148 98 M 104 126 L 152 140
      M 104 210 L 150 200 M 104 210 L 146 246
      M 148 98 L 182 82 M 148 98 L 186 106
      M 152 140 L 190 132 M 152 140 L 188 156
      M 150 200 L 190 192 M 150 200 L 186 214
      M 146 246 L 184 240 M 146 246 L 178 268"/>
  </defs>

  <!-- STAGE 1 : inject -->
  <g transform="translate(30,0)">
    <text class="step" x="0" y="36">1 &#183; Inject</text>

    <rect class="tissue" x="0" y="62" width="228" height="228" rx="6"/>
    <use href="#tree" class="wall" stroke-width="7"/>
    <use href="#tree" class="resin" stroke-width="4" stroke-dasharray="120 900"/>

    <path class="resin" stroke-width="3" d="M -22 168 L 4 168" marker-end="url(#push)"/>
    <text class="tagr" x="-24" y="152">resin in</text>
    <text class="tag" x="120" y="308">blood flushed out first</text>

    <text class="sub" x="0" y="336">Liquid resin is pushed through the</text>
    <text class="sub" x="0" y="355">vessels until it reaches the smallest</text>
    <text class="sub" x="0" y="374">branches.</text>
  </g>

  <!-- STAGE 2 : cure -->
  <g transform="translate(320,0)">
    <text class="step" x="0" y="36">2 &#183; Set</text>

    <rect class="tissue" x="0" y="62" width="228" height="228" rx="6"/>
    <use href="#tree" class="wall" stroke-width="7"/>
    <use href="#tree" class="resin" stroke-width="4"/>

    <text class="tag" x="10" y="308">tissue still intact</text>

    <text class="sub" x="0" y="336">The resin hardens inside the network,</text>
    <text class="sub" x="0" y="355">taking the exact shape of every</text>
    <text class="sub" x="0" y="374">channel it filled.</text>
  </g>

  <!-- STAGE 3 : corrode -->
  <g transform="translate(610,0)">
    <text class="step" x="0" y="36">3 &#183; Dissolve</text>

    <rect class="gone" x="0" y="62" width="228" height="228" rx="6"/>
    <use href="#tree" class="resin" stroke-width="4"/>

    <text class="tagr" x="4" y="308">walls dissolved too</text>

    <text class="sub" x="0" y="336">Strong alkali removes everything</text>
    <text class="sub" x="0" y="355">else, including the vessel walls.</text>
    <text class="sub" x="0" y="374">Only the cast is left.</text>
  </g>
</svg>
