<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="hTitle hDesc">
  <title id="hTitle">Conjoined twins compared with heteropagus parasitic twinning</title>
  <desc id="hDesc">Two schematic diagrams. On the left, conjoined twins: two complete bodies, each with its own heart, joined at a shared surface. On the right, heteropagus twinning: one complete body with a working heart, called the autosite, carrying an incomplete attached twin with no heart and no functioning organs, called the parasite, which is supplied entirely by the autosite's circulation.</desc>

  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0413e"/>
    </marker>
    <style>
      .body    { fill: #eef3f7; stroke: #0a1f33; stroke-width: 2.2; stroke-linejoin: round; }
      .para    { fill: #f6f9fb; stroke: #0a1f33; stroke-width: 2.2; stroke-dasharray: 6 4; stroke-linejoin: round; }
      .heart   { fill: #b0413e; }
      .noheart { fill: none; stroke: #9aa9b6; stroke-width: 2; stroke-dasharray: 3 3; }
      .vessel  { stroke: #b0413e; stroke-width: 2.4; fill: none; }
      .lbl     { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; fill: #0a1f33; }
      .tag     { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.08em; fill: #3d6485; }
      .sub     { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #12395c; }
      .key     { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #12395c; }
    </style>
  </defs>

  <rect width="860" height="400" fill="#ffffff"/>

  <!-- PANEL 1 : conjoined -->
  <g transform="translate(50,0)">
    <text class="lbl" x="0" y="36">Conjoined twins</text>

    <!-- left twin -->
    <circle class="body" cx="90" cy="105" r="30"/>
    <path class="body" d="M 62 145 L 118 145 L 126 245 L 54 245 Z"/>
    <circle class="heart" cx="100" cy="180" r="9"/>
    <text class="tag" x="60" y="268">heart</text>

    <!-- right twin -->
    <circle class="body" cx="210" cy="105" r="30"/>
    <path class="body" d="M 182 145 L 238 145 L 246 245 L 174 245 Z"/>
    <circle class="heart" cx="200" cy="180" r="9"/>
    <text class="tag" x="196" y="268">heart</text>

    <!-- join -->
    <rect x="118" y="160" width="64" height="70" fill="#dbe6ee" stroke="#0a1f33" stroke-width="2.2"/>
    <text class="tag" x="118" y="152">shared</text>

    <text class="sub" x="0" y="310">Two complete bodies. Each has its own</text>
    <text class="sub" x="0" y="329">heart and drives its own circulation.</text>
    <text class="sub" x="0" y="348">Separation must divide what they share.</text>
  </g>

  <!-- PANEL 2 : heteropagus -->
  <g transform="translate(480,0)">
    <text class="lbl" x="0" y="36">Heteropagus (parasitic)</text>

    <!-- autosite -->
    <circle class="body" cx="100" cy="105" r="30"/>
    <path class="body" d="M 72 145 L 128 145 L 136 245 L 64 245 Z"/>
    <circle class="heart" cx="110" cy="180" r="9"/>
    <text class="tag" x="66" y="268">autosite</text>

    <!-- parasite: partial head plus rudimentary limb, no heart -->
    <circle class="para" cx="196" cy="150" r="26"/>
    <path class="para" d="M 178 176 Q 196 206 186 236 L 168 226 Q 176 200 170 180 Z"/>
    <circle class="noheart" cx="196" cy="150" r="8"/>
    <text class="tag" x="166" y="268">parasite</text>
    <text class="tag" x="150" y="120">no heart</text>

    <!-- blood supply from autosite to parasite -->
    <path class="vessel" d="M 120 182 Q 160 168 176 156" marker-end="url(#flow)"/>

    <text class="sub" x="0" y="310">One complete body carries an incomplete</text>
    <text class="sub" x="0" y="329">twin with no heart of its own. Every drop of</text>
    <text class="sub" x="0" y="348">blood it receives is pumped by the autosite.</text>
  </g>

  <!-- key -->
  <circle class="heart" cx="52" cy="382" r="7"/>
  <text class="key" x="66" y="387">Working heart</text>
  <circle class="noheart" cx="222" cy="382" r="7"/>
  <text class="key" x="236" y="387">No heart</text>
  <line class="vessel" x1="360" y1="382" x2="392" y2="382" marker-end="url(#flow)"/>
  <text class="key" x="404" y="387">Blood supplied by the autosite</text>
</svg>
