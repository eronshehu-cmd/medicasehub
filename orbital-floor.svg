<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ofTitle ofDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ofTitle">The floor under the eye</title>
  <desc id="ofDesc">Three cross-sections through the eye socket, seen from the front. First, the eyeball rests on a thin plate of bone that separates the socket from the air cavity below. Second, when disease destroys that plate and it has to be removed, the eyeball sinks and drops, so the two eyes no longer line up and the patient sees double. Third, a titanium mesh sling is fixed across the gap to hold the eye at its original level.</desc>

  <defs>
    <style>
      .bone   { fill: #f2ece1; stroke: #0a1f33; stroke-width: 2.4; stroke-linejoin: round; }
      .cavity { fill: #ffffff; stroke: #0a1f33; stroke-width: 2; }
      .floor  { fill: #ded3bf; stroke: #0a1f33; stroke-width: 2.2; }
      .globe  { fill: #eef3f7; stroke: #0a1f33; stroke-width: 2.4; }
      .iris   { fill: #6f8ba0; stroke: #0a1f33; stroke-width: 1.6; }
      .mesh   { fill: none; stroke: #0f7a73; stroke-width: 3.4; }
      .meshx  { stroke: #0f7a73; stroke-width: 1.6; }
      .ref    { stroke: #b0413e; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .drop   { stroke: #b0413e; stroke-width: 2; }
      .step   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; fill: #0a1f33; }
      .tag    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #3d6485; }
      .tagr   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #b0413e; }
      .tagt   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #0f7a73; }
      .sub    { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #12395c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#ffffff"/>

  <!-- PANEL 1 : intact -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="36">Intact</text>

    <path class="bone" d="M 40 62 L 232 62 L 232 300 L 40 300 Z"/>
    <path class="cavity" d="M 62 80 L 210 80 L 210 176 L 62 176 Z"/>
    <path class="cavity" d="M 70 200 L 202 200 L 202 282 L 70 282 Z"/>
    <rect class="floor" x="62" y="176" width="148" height="16"/>

    <circle class="globe" cx="136" cy="132" r="42"/>
    <circle class="iris" cx="136" cy="132" r="16"/>

    <line class="ref" x1="24" y1="132" x2="248" y2="132"/>
    <text class="tag" x="66" y="230">air cavity</text>
    <text class="tag" x="66" y="212">below</text>

    <text class="sub" x="0" y="332">A thin plate of bone carries the</text>
    <text class="sub" x="0" y="351">weight of the eye.</text>
  </g>

  <!-- PANEL 2 : floor gone -->
  <g transform="translate(320,0)">
    <text class="step" x="0" y="36">Floor removed</text>

    <path class="bone" d="M 40 62 L 232 62 L 232 300 L 40 300 Z"/>
    <path class="cavity" d="M 62 80 L 210 80 L 210 282 L 62 282 Z"/>

    <circle class="globe" cx="136" cy="176" r="42"/>
    <circle class="iris" cx="136" cy="176" r="16"/>

    <line class="ref" x1="24" y1="132" x2="248" y2="132"/>
    <line class="drop" x1="196" y1="132" x2="196" y2="176"/>
    <path class="drop" d="M 190 168 L 196 178 L 202 168"/>
    <text class="tagr" x="204" y="158">drops</text>

    <text class="sub" x="0" y="332">With nothing beneath it the eye</text>
    <text class="sub" x="0" y="351">sinks and falls out of line, and</text>
    <text class="sub" x="0" y="370">the patient sees double.</text>
  </g>

  <!-- PANEL 3 : mesh sling -->
  <g transform="translate(600,0)">
    <text class="step" x="0" y="36">Mesh sling</text>

    <path class="bone" d="M 40 62 L 232 62 L 232 300 L 40 300 Z"/>
    <path class="cavity" d="M 62 80 L 210 80 L 210 176 L 62 176 Z"/>
    <path class="cavity" d="M 70 200 L 202 200 L 202 282 L 70 282 Z"/>

    <path class="mesh" d="M 62 178 Q 136 196 210 178"/>
    <g class="meshx">
      <path d="M 84 182 L 84 190"/>
      <path d="M 106 186 L 106 194"/>
      <path d="M 136 188 L 136 196"/>
      <path d="M 166 186 L 166 194"/>
      <path d="M 188 182 L 188 190"/>
    </g>

    <circle class="globe" cx="136" cy="132" r="42"/>
    <circle class="iris" cx="136" cy="132" r="16"/>

    <line class="ref" x1="24" y1="132" x2="248" y2="132"/>
    <text class="tagt" x="70" y="220">titanium mesh</text>

    <text class="sub" x="0" y="332">The mesh is anchored to the bone</text>
    <text class="sub" x="0" y="351">that remains and holds the eye at</text>
    <text class="sub" x="0" y="370">its original level.</text>
  </g>
</svg>
