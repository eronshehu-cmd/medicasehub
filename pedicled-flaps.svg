<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="pfTitle pfDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="pfTitle">Two flaps that never leave their blood supply</title>
  <desc id="pfDesc">A side view of the head and chest. The temporalis muscle at the temple is swung downward under the cheekbone to line the inside of the mouth. The pectoralis major muscle with its overlying skin is raised from the chest and tunnelled under the skin of the neck to cover the outside of the face. Each flap stays joined to its own artery at a pivot point, so neither needs vessels to be cut and rejoined under a microscope.</desc>

  <defs>
    <marker id="swing1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <marker id="swing2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a73"/>
    </marker>
    <style>
      .body   { fill: #f4e3d8; stroke: #0c1a22; stroke-width: 2.4; stroke-linejoin: round; }
      .bone   { fill: none; stroke: #b9ad9c; stroke-width: 2.2; }
      .temp   { fill: #d98a72; stroke: #8d4a38; stroke-width: 1.8; }
      .pec    { fill: #8fb8b2; stroke: #0b5f59; stroke-width: 1.8; }
      .arc1   { stroke: #a8451a; stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; }
      .arc2   { stroke: #0f7a73; stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; }
      .pivot1 { fill: #a8451a; }
      .pivot2 { fill: #0f7a73; }
      .defect { fill: #efe9dc; stroke: #0c1a22; stroke-width: 2; stroke-dasharray: 5 4; }
      .lab    { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .06em; fill: #0c1a22; }
      .lab1   { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .lab2   { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #0f7a73; }
      .sub    { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
      .step   { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
    </style>
  </defs>

  <rect width="860" height="430" fill="#fffefb"/>
  <text class="step" x="40" y="34">Both flaps stay attached and swing into place</text>

  <!-- head and torso, seen from the side, facing left -->
  <g>
    <path class="body" d="M 214 62 C 288 44, 344 92, 344 150 C 344 190, 330 214, 316 232
                          L 316 268 C 372 286, 430 316, 452 392 L 452 404 L 176 404
                          L 176 330 C 176 300, 206 280, 250 268 L 250 232
                          C 214 222, 186 190, 186 148 C 186 110, 196 78, 214 62 Z"/>
    <path class="bone" d="M 232 174 C 262 186, 292 184, 314 172"/>
    <ellipse cx="318" cy="158" rx="13" ry="19" fill="#f4e3d8" stroke="#0c1a22" stroke-width="2"/>
    <text class="lab" x="336" y="162">ear</text>

    <!-- the defect: left side of the oral cavity, gone -->
    <path class="defect" d="M 206 176 q 32 -10 54 6 q 6 24 -18 32 q -32 6 -42 -14 Z"/>
    <text class="lab" x="150" y="230">the defect</text>

    <!-- temporalis, at the temple -->
    <path class="temp" d="M 226 84 q 46 -8 68 18 q 8 26 -18 34 q -44 8 -58 -16 Z"/>
    <circle class="pivot1" cx="286" cy="132" r="5"/>
    <text class="lab1" x="240" y="76">temporalis</text>
    <text class="lab1" x="296" y="126">pivot</text>
    <path class="arc1" d="M 286 132 q -18 34 -34 50" marker-end="url(#swing1)"/>

    <!-- pectoralis major, on the chest -->
    <path class="pec" d="M 300 320 q 70 -6 106 30 q 10 34 -30 44 q -76 6 -90 -32 Z"/>
    <circle class="pivot2" cx="306" cy="308" r="5"/>
    <text class="lab2" x="326" y="404">pectoralis major</text>
    <text class="lab2" x="316" y="302">pivot</text>
    <path class="arc2" d="M 306 308 C 292 262, 282 216, 272 196" marker-end="url(#swing2)"/>
  </g>

  <!-- explanation -->
  <g transform="translate(500,0)">
    <text class="lab1" x="0" y="92">1 &#183; Temporalis, inward</text>
    <text class="sub" x="0" y="116">The chewing muscle at the temple is</text>
    <text class="sub" x="0" y="135">freed at one end, swung down beneath</text>
    <text class="sub" x="0" y="154">the cheekbone, and used to line the</text>
    <text class="sub" x="0" y="173">inside of the mouth.</text>

    <text class="lab2" x="0" y="222">2 &#183; Pectoralis major, outward</text>
    <text class="sub" x="0" y="246">A paddle of chest muscle with the skin</text>
    <text class="sub" x="0" y="265">above it is raised, tunnelled under the</text>
    <text class="sub" x="0" y="284">skin of the neck, and laid over the face</text>
    <text class="sub" x="0" y="303">to cover the outside.</text>

    <text class="lab" x="0" y="350">Neither is cut free</text>
    <text class="sub" x="0" y="374">Each keeps its own artery at the pivot,</text>
    <text class="sub" x="0" y="393">so no vessel has to be divided and</text>
    <text class="sub" x="0" y="412">rejoined under a microscope.</text>
  </g>
</svg>
