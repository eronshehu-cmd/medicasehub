<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="awTitle awDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="awTitle">Why he could breathe sitting up but not lying down</title>
  <desc id="awDesc">Three side views of a head. With the facial skeleton intact, the airway behind the nose and mouth stays open whatever position the patient is in. When the midface is broken free of the skull it hangs forward while the patient sits up, so the airway is still clear. Lying the same patient flat allows the detached midface to fall backwards into the throat and close it.</desc>

  <defs>
    <marker id="air" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a73"/>
    </marker>
    <marker id="noair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <style>
      .head   { fill: #f4e3d8; stroke: #0c1a22; stroke-width: 2.4; stroke-linejoin: round; }
      .brain  { fill: #eceae4; stroke: #b9b0a4; stroke-width: 1.6; }
      .mid    { fill: #d9bfa8; stroke: #0c1a22; stroke-width: 2.2; }
      .midx   { fill: #c49a7a; stroke: #0c1a22; stroke-width: 2.2; }
      .airway { fill: #dff0ec; stroke: #0f7a73; stroke-width: 2; }
      .blocked{ fill: #f0dcd4; stroke: #a8451a; stroke-width: 2; }
      .flow   { stroke: #0f7a73; stroke-width: 3; fill: none; stroke-linecap: round; }
      .noflow { stroke: #a8451a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .blockx { stroke: #a8451a; stroke-width: 4.5; stroke-linecap: round; }
      .step   { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagr   { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .sub    { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="880" height="420" fill="#fffefb"/>

  <!-- 1. intact -->
  <g transform="translate(36,0)">
    <text class="step" x="0" y="34">Intact face</text>
    <path class="head" d="M 60 70 C 130 52, 186 96, 186 150 C 186 186, 176 210, 166 226
                          L 166 274 L 96 274 L 96 236 C 62 224, 40 190, 40 152 C 40 116, 46 86, 60 70 Z"/>
    <ellipse class="brain" cx="118" cy="126" rx="52" ry="44"/>
    <path class="mid" d="M 42 158 L 104 152 L 104 200 L 46 206 Z"/>
    <path class="airway" d="M 106 150 L 132 150 L 132 274 L 106 274 Z"/>
    <path class="flow" d="M 119 168 L 119 258" marker-end="url(#air)"/>
    <text class="tag" x="6" y="228">midface</text>
    <text class="tag" x="140" y="300">airway</text>
    <text class="sub" x="0" y="336">The bones of the midface are joined</text>
    <text class="sub" x="0" y="355">to the skull, so the airway behind</text>
    <text class="sub" x="0" y="374">them keeps its shape in any position.</text>
  </g>

  <!-- 2. broken, sitting -->
  <g transform="translate(330,0)">
    <text class="step" x="0" y="34">Broken, sitting up</text>
    <path class="head" d="M 60 70 C 130 52, 186 96, 186 150 C 186 186, 176 210, 166 226
                          L 166 274 L 96 274 L 96 236 C 62 224, 40 190, 40 152 C 40 116, 46 86, 60 70 Z"/>
    <ellipse class="brain" cx="118" cy="126" rx="52" ry="44"/>
    <path class="midx" d="M 24 168 L 92 154 L 96 202 L 30 216 Z"/>
    <path class="airway" d="M 106 150 L 132 150 L 132 274 L 106 274 Z"/>
    <path class="flow" d="M 119 168 L 119 258" marker-end="url(#air)"/>
    <text class="tagr" x="0" y="242">hangs forward</text>
    <text class="sub" x="0" y="336">Broken free, the midface falls</text>
    <text class="sub" x="0" y="355">forward under its own weight and</text>
    <text class="sub" x="0" y="374">leaves the airway alone.</text>
  </g>

  <!-- 3. broken, supine -->
  <g transform="translate(624,0)">
    <text class="step" x="0" y="34">Broken, lying flat</text>
    <path class="head" d="M 60 70 C 130 52, 186 96, 186 150 C 186 186, 176 210, 166 226
                          L 166 274 L 96 274 L 96 236 C 62 224, 40 190, 40 152 C 40 116, 46 86, 60 70 Z"/>
    <ellipse class="brain" cx="118" cy="126" rx="52" ry="44"/>
    <path class="midx" d="M 56 152 L 124 166 L 128 212 L 60 200 Z"/>
    <path class="blocked" d="M 106 150 L 132 150 L 132 274 L 106 274 Z"/>
    <path class="noflow" d="M 119 168 L 119 196" marker-end="url(#noair)"/>
    <path class="blockx" d="M 108 208 L 132 236 M 132 208 L 108 236"/>
    <text class="tagr" x="0" y="256">falls back into the throat</text>
    <text class="sub" x="0" y="336">Gravity now pulls the same loose</text>
    <text class="sub" x="0" y="355">segment backwards, and it closes</text>
    <text class="sub" x="0" y="374">the airway behind it.</text>
  </g>
</svg>
