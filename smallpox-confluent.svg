<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="spTitle spDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="spTitle">Why merging pustules change the outcome</title>
  <desc id="spDesc">Two patches of skin compared. In discrete smallpox the pustules sit apart with normal skin between them, and around one patient in ten died. In confluent smallpox the pustules merge, destroying the skin between them so that large areas behave like a burn, and more than half of those patients died.</desc>

  <defs>
    <style>
      .skin   { fill: #f4e3d8; stroke: #0c1a22; stroke-width: 2.2; }
      .pust   { fill: #e8d2c0; stroke: #9c7b63; stroke-width: 1.6; }
      .merged { fill: #c9a288; stroke: #8d6a52; stroke-width: 1.8; }
      .raw    { fill: #b4796a; stroke: #7d4f43; stroke-width: 1.8; }
      .bar1   { fill: #8fb8b2; }
      .bar2   { fill: #a8451a; }
      .axis   { stroke: #c9c2b4; stroke-width: 1.4; }
      .step   { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .num    { font-family: 'Newsreader', Georgia, serif; font-size: 30px; fill: #0c1a22; }
      .sub    { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="860" height="400" fill="#fffefb"/>

  <!-- discrete -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="34">Discrete</text>
    <rect class="skin" x="0" y="54" width="230" height="150" rx="6"/>
    <g class="pust">
      <circle cx="30" cy="82" r="11"/><circle cx="74" cy="76" r="9"/><circle cx="120" cy="86" r="12"/>
      <circle cx="166" cy="78" r="10"/><circle cx="204" cy="88" r="9"/>
      <circle cx="40" cy="126" r="10"/><circle cx="88" cy="132" r="12"/><circle cx="136" cy="124" r="9"/>
      <circle cx="180" cy="130" r="11"/>
      <circle cx="26" cy="172" r="9"/><circle cx="72" cy="176" r="11"/><circle cx="124" cy="170" r="10"/>
      <circle cx="172" cy="178" r="9"/><circle cx="208" cy="166" r="8"/>
    </g>
    <text class="tag" x="0" y="228">skin between them is intact</text>
    <text class="sub" x="0" y="268">Each lesion heals on its own and</text>
    <text class="sub" x="0" y="287">leaves a pitted scar.</text>
  </g>

  <!-- confluent -->
  <g transform="translate(320,0)">
    <text class="step" x="0" y="34">Confluent</text>
    <rect class="skin" x="0" y="54" width="230" height="150" rx="6"/>
    <path class="raw" d="M 12 68 q 60 -10 112 4 q 62 -6 94 8 l 0 118 q -80 12 -122 -2 q -50 10 -84 -4 Z"/>
    <g class="merged">
      <circle cx="44" cy="94" r="16"/><circle cx="86" cy="88" r="18"/><circle cx="132" cy="96" r="17"/>
      <circle cx="178" cy="90" r="16"/>
      <circle cx="56" cy="136" r="18"/><circle cx="102" cy="142" r="19"/><circle cx="152" cy="134" r="17"/>
      <circle cx="196" cy="140" r="15"/>
      <circle cx="40" cy="176" r="16"/><circle cx="88" cy="180" r="17"/><circle cx="140" cy="174" r="16"/>
      <circle cx="186" cy="180" r="15"/>
    </g>
    <text class="tag" x="0" y="228">no skin left between them</text>
    <text class="sub" x="0" y="268">Whole areas lose their surface at</text>
    <text class="sub" x="0" y="287">once and behave like a deep burn.</text>
  </g>

  <!-- mortality -->
  <g transform="translate(620,0)">
    <text class="step" x="0" y="34">Roughly how many died</text>
    <line class="axis" x1="0" y1="204" x2="200" y2="204"/>

    <rect class="bar1" x="20" y="184" width="52" height="20"/>
    <text class="num" x="20" y="172">1 in 10</text>
    <text class="tag" x="20" y="224">discrete</text>

    <rect class="bar2" x="118" y="90" width="52" height="114"/>
    <text class="num" x="112" y="78">6 in 10</text>
    <text class="tag" x="118" y="224">confluent</text>

    <text class="sub" x="0" y="268">The same disease. What changed</text>
    <text class="sub" x="0" y="287">the odds was how much skin was</text>
    <text class="sub" x="0" y="306">lost at once.</text>
  </g>
</svg>
