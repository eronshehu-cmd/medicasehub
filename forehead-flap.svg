<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="ffTitle ffDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ffTitle">How a nose is rebuilt from forehead skin</title>
  <desc id="ffDesc">Three stages. First, a tall strip of forehead skin is outlined, positioned over the artery that runs up from the inner eyebrow. Second, the strip is cut free at the top, swung down over the nose, and left attached at the eyebrow so it keeps its blood supply. Third, once the transferred skin has grown its own supply from the surrounding tissue, the connecting bridge is divided and the forehead is closed.</desc>

  <defs>
    <style>
      .skin   { fill: #fdf1ea; stroke: #0a1f33; stroke-width: 2.4; }
      .flap   { fill: #f2d8c8; stroke: #0a1f33; stroke-width: 2.2; }
      .defect { fill: #e8e0da; stroke: #b0413e; stroke-width: 2; stroke-dasharray: 5 4; }
      .art    { stroke: #b0413e; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .feat   { stroke: #0a1f33; stroke-width: 2.2; fill: none; stroke-linecap: round; }
      .close  { stroke: #b0413e; stroke-width: 2; fill: none; }
      .step   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; fill: #0a1f33; }
      .tag    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #3d6485; }
      .tagr   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #b0413e; }
      .sub    { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #12395c; }
    </style>
  </defs>

  <rect width="900" height="420" fill="#ffffff"/>

  <!-- STAGE 1 : plan -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="34">1 &#183; Plan</text>

    <ellipse class="skin" cx="112" cy="180" rx="76" ry="98"/>
    <path class="feat" d="M 78 152 Q 92 144 106 152"/>
    <path class="feat" d="M 118 152 Q 132 144 146 152"/>
    <circle cx="92" cy="166" r="5" fill="#0a1f33"/>
    <circle cx="132" cy="166" r="5" fill="#0a1f33"/>
    <path class="defect" d="M 100 194 L 124 194 L 130 236 L 94 236 Z"/>
    <path class="feat" d="M 92 258 Q 112 266 132 258"/>

    <path class="flap" d="M 98 96 L 126 96 L 126 146 L 98 146 Z" rx="4"/>
    <path class="art" d="M 112 150 L 112 100"/>
    <text class="tagr" x="140" y="118">artery from</text>
    <text class="tagr" x="140" y="132">the eyebrow</text>
    <text class="tag" x="4" y="300">skin marked out</text>

    <text class="sub" x="0" y="336">Forehead skin matches the nose in</text>
    <text class="sub" x="0" y="355">colour and thickness, and one artery</text>
    <text class="sub" x="0" y="374">reliably supplies it.</text>
  </g>

  <!-- STAGE 2 : swing down -->
  <g transform="translate(340,0)">
    <text class="step" x="0" y="34">2 &#183; Swing down</text>

    <ellipse class="skin" cx="112" cy="180" rx="76" ry="98"/>
    <path class="feat" d="M 78 152 Q 92 144 106 152"/>
    <path class="feat" d="M 118 152 Q 132 144 146 152"/>
    <circle cx="92" cy="166" r="5" fill="#0a1f33"/>
    <circle cx="132" cy="166" r="5" fill="#0a1f33"/>
    <path class="feat" d="M 92 258 Q 112 266 132 258"/>

    <path class="defect" d="M 98 100 L 126 100 L 126 142 L 98 142 Z"/>
    <text class="tagr" x="134" y="98">donor site</text>

    <path class="flap" d="M 104 146 C 96 168, 92 178, 96 190 L 100 192 L 96 236 L 132 236 L 128 190 C 134 176, 128 162, 120 148 Z"/>
    <path class="art" d="M 112 150 C 106 168, 104 178, 108 190"/>
    <text class="tagr" x="6" y="196">still attached</text>

    <text class="sub" x="0" y="336">Cut free at the top, rotated down,</text>
    <text class="sub" x="0" y="355">and left joined at the brow so blood</text>
    <text class="sub" x="0" y="374">keeps reaching it.</text>
  </g>

  <!-- STAGE 3 : divide -->
  <g transform="translate(640,0)">
    <text class="step" x="0" y="34">3 &#183; Divide</text>

    <ellipse class="skin" cx="112" cy="180" rx="76" ry="98"/>
    <path class="feat" d="M 78 152 Q 92 144 106 152"/>
    <path class="feat" d="M 118 152 Q 132 144 146 152"/>
    <circle cx="92" cy="166" r="5" fill="#0a1f33"/>
    <circle cx="132" cy="166" r="5" fill="#0a1f33"/>
    <path class="feat" d="M 92 258 Q 112 266 132 258"/>

    <path class="close" d="M 112 100 L 112 144"/>
    <text class="tag" x="122" y="116">closed</text>

    <path class="flap" d="M 104 192 C 98 204, 94 220, 96 238 L 130 238 C 132 220, 128 204, 122 192 Z"/>
    <path class="feat" d="M 104 232 Q 112 236 120 232"/>

    <text class="sub" x="0" y="336">Weeks later the bridge is divided.</text>
    <text class="sub" x="0" y="355">The new nose now has a blood supply</text>
    <text class="sub" x="0" y="374">of its own.</text>
  </g>
</svg>
