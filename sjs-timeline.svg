<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="sjsTitle sjsDesc">
  <title id="sjsTitle">The window where Stevens-Johnson syndrome looks like a virus</title>
  <desc id="sjsDesc">A timeline. A new medicine is started. Nothing happens for one to four weeks. Then a phase of fever, sore throat and sore eyes begins, which is indistinguishable from a viral illness and is where the diagnosis is usually missed and further medicines are added. Only afterwards do painful mouth, eye and skin lesions appear and the skin begins to detach.</desc>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a1f33"/>
    </marker>
    <style>
      .quiet  { fill: #e6edf2; }
      .warn   { fill: #f0d9a8; }
      .bad    { fill: #d99b96; }
      .axis   { stroke: #0a1f33; stroke-width: 2; }
      .drop   { stroke: #0a1f33; stroke-width: 1.4; stroke-dasharray: 4 3; }
      .trap   { stroke: #b0413e; stroke-width: 2.4; fill: none; }
      .phase  { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; fill: #0a1f33; }
      .day    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; fill: #3d6485; }
      .body   { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #12395c; }
      .alert  { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #b0413e; }
      .alertb { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; fill: #b0413e; }
    </style>
  </defs>

  <rect width="880" height="380" fill="#ffffff"/>

  <!-- the trap bracket, above -->
  <path class="trap" d="M 330 96 L 330 78 L 560 78 L 560 96"/>
  <text class="alertb" x="330" y="62">Mistaken for a virus here</text>
  <text class="alert" x="330" y="44">More medicines are often added at this point</text>

  <!-- timeline bands -->
  <rect class="quiet" x="90" y="150" width="240" height="46" rx="3"/>
  <rect class="warn"  x="330" y="150" width="230" height="46" rx="3"/>
  <rect class="bad"   x="560" y="150" width="240" height="46" rx="3"/>

  <line class="axis" x1="90" y1="214" x2="810" y2="214" marker-end="url(#tip)"/>

  <!-- start marker -->
  <line class="drop" x1="90" y1="110" x2="90" y2="150"/>
  <circle cx="90" cy="110" r="7" fill="#0a1f33"/>
  <text class="phase" x="66" y="132">Day 0</text>
  <text class="body" x="30" y="248">A new medicine</text>
  <text class="body" x="30" y="266">is started.</text>

  <!-- phase labels -->
  <text class="phase" x="120" y="178">Nothing</text>
  <text class="day"   x="120" y="234">4 to 28 days</text>
  <text class="body"  x="120" y="266">No symptoms at all.</text>
  <text class="body"  x="120" y="284">The link is already</text>
  <text class="body"  x="120" y="302">easy to forget.</text>

  <text class="phase" x="352" y="178">Looks viral</text>
  <text class="day"   x="352" y="234">1 to 3 days</text>
  <text class="body"  x="352" y="266">Fever, sore throat,</text>
  <text class="body"  x="352" y="284">aching, burning eyes.</text>
  <text class="alert" x="352" y="308">Nothing on the skin yet.</text>

  <text class="phase" x="584" y="178">Unmistakable</text>
  <text class="day"   x="584" y="234">then rapidly</text>
  <text class="body"  x="584" y="266">Raw mouth and eyes,</text>
  <text class="body"  x="584" y="284">painful rash, skin</text>
  <text class="body"  x="584" y="302">peeling away.</text>

  <text class="alertb" x="30" y="348">The question that closes the gap: what was started in the last month?</text>
</svg>
