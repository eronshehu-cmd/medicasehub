<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="dtTitle dtDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="dtTitle">Why the fastest tumours melt the fastest</title>
  <desc id="dtDesc">Three panels. In a slow-growing tumour only a few cells are dividing at any moment. In a very fast tumour almost every cell is dividing at once, which is why it becomes large in weeks. Because chemotherapy kills cells while they divide, the slow tumour is barely touched while the fast one loses most of its cells at the same dose.</desc>

  <defs>
    <style>
      .mass    { fill: #efe6da; stroke: #0c1a22; stroke-width: 2.2; }
      .quiet   { fill: #cfc7ba; }
      .dividing{ fill: #a8451a; }
      .killed  { fill: none; stroke: #6c7c85; stroke-width: 1.6; }
      .drug    { stroke: #0f7a73; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .step    { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag     { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagr    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .tagg    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #0f7a73; }
      .sub     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#fffefb"/>

  <!-- 1 slow -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="34">Slow tumour</text>
    <rect class="mass" x="0" y="56" width="220" height="170" rx="8"/>
    <g>
      <circle class="quiet" cx="28" cy="84" r="9"/><circle class="quiet" cx="60" cy="84" r="9"/>
      <circle class="dividing" cx="92" cy="84" r="9"/><circle class="quiet" cx="124" cy="84" r="9"/>
      <circle class="quiet" cx="156" cy="84" r="9"/><circle class="quiet" cx="188" cy="84" r="9"/>
      <circle class="quiet" cx="28" cy="120" r="9"/><circle class="quiet" cx="60" cy="120" r="9"/>
      <circle class="quiet" cx="92" cy="120" r="9"/><circle class="quiet" cx="124" cy="120" r="9"/>
      <circle class="dividing" cx="156" cy="120" r="9"/><circle class="quiet" cx="188" cy="120" r="9"/>
      <circle class="quiet" cx="28" cy="156" r="9"/><circle class="quiet" cx="60" cy="156" r="9"/>
      <circle class="quiet" cx="92" cy="156" r="9"/><circle class="quiet" cx="124" cy="156" r="9"/>
      <circle class="quiet" cx="156" cy="156" r="9"/><circle class="quiet" cx="188" cy="156" r="9"/>
      <circle class="quiet" cx="28" cy="192" r="9"/><circle class="dividing" cx="60" cy="192" r="9"/>
      <circle class="quiet" cx="92" cy="192" r="9"/><circle class="quiet" cx="124" cy="192" r="9"/>
      <circle class="quiet" cx="156" cy="192" r="9"/><circle class="quiet" cx="188" cy="192" r="9"/>
    </g>
    <text class="tagr" x="0" y="252">3 of 24 dividing</text>
    <text class="sub" x="0" y="296">Most cells are resting at any given</text>
    <text class="sub" x="0" y="315">moment. It grows over years.</text>
  </g>

  <!-- 2 fast -->
  <g transform="translate(330,0)">
    <text class="step" x="0" y="34">Very fast tumour</text>
    <rect class="mass" x="0" y="56" width="220" height="170" rx="8"/>
    <g>
      <circle class="dividing" cx="28" cy="84" r="9"/><circle class="dividing" cx="60" cy="84" r="9"/>
      <circle class="dividing" cx="92" cy="84" r="9"/><circle class="quiet" cx="124" cy="84" r="9"/>
      <circle class="dividing" cx="156" cy="84" r="9"/><circle class="dividing" cx="188" cy="84" r="9"/>
      <circle class="dividing" cx="28" cy="120" r="9"/><circle class="dividing" cx="60" cy="120" r="9"/>
      <circle class="dividing" cx="92" cy="120" r="9"/><circle class="dividing" cx="124" cy="120" r="9"/>
      <circle class="dividing" cx="156" cy="120" r="9"/><circle class="quiet" cx="188" cy="120" r="9"/>
      <circle class="dividing" cx="28" cy="156" r="9"/><circle class="quiet" cx="60" cy="156" r="9"/>
      <circle class="dividing" cx="92" cy="156" r="9"/><circle class="dividing" cx="124" cy="156" r="9"/>
      <circle class="dividing" cx="156" cy="156" r="9"/><circle class="dividing" cx="188" cy="156" r="9"/>
      <circle class="dividing" cx="28" cy="192" r="9"/><circle class="dividing" cx="60" cy="192" r="9"/>
      <circle class="dividing" cx="92" cy="192" r="9"/><circle class="dividing" cx="124" cy="192" r="9"/>
      <circle class="quiet" cx="156" cy="192" r="9"/><circle class="dividing" cx="188" cy="192" r="9"/>
    </g>
    <text class="tagr" x="0" y="252">20 of 24 dividing</text>
    <text class="sub" x="0" y="296">Almost every cell is dividing at once.</text>
    <text class="sub" x="0" y="315">It becomes enormous in weeks.</text>
  </g>

  <!-- 3 chemo -->
  <g transform="translate(620,0)">
    <text class="step" x="0" y="34">Same dose, both</text>
    <rect class="mass" x="0" y="56" width="220" height="76" rx="8"/>
    <g>
      <circle class="quiet" cx="28" cy="84" r="9"/><circle class="quiet" cx="60" cy="84" r="9"/>
      <circle class="killed" cx="92" cy="84" r="9"/><circle class="quiet" cx="124" cy="84" r="9"/>
      <circle class="quiet" cx="156" cy="84" r="9"/><circle class="quiet" cx="188" cy="84" r="9"/>
      <circle class="quiet" cx="28" cy="112" r="9"/><circle class="quiet" cx="60" cy="112" r="9"/>
      <circle class="quiet" cx="92" cy="112" r="9"/><circle class="quiet" cx="124" cy="112" r="9"/>
      <circle class="killed" cx="156" cy="112" r="9"/><circle class="quiet" cx="188" cy="112" r="9"/>
    </g>
    <text class="tag" x="0" y="150">slow: barely dented</text>

    <rect class="mass" x="0" y="170" width="220" height="56" rx="8"/>
    <g>
      <circle class="killed" cx="28" cy="196" r="9"/><circle class="killed" cx="60" cy="196" r="9"/>
      <circle class="killed" cx="92" cy="196" r="9"/><circle class="quiet" cx="124" cy="196" r="9"/>
      <circle class="killed" cx="156" cy="196" r="9"/><circle class="killed" cx="188" cy="196" r="9"/>
    </g>
    <text class="tagg" x="0" y="252">fast: most of it gone</text>

    <text class="sub" x="0" y="296">Chemotherapy kills cells while they</text>
    <text class="sub" x="0" y="315">divide, so the speed that made it</text>
    <text class="sub" x="0" y="334">frightening is what makes it fall apart.</text>
  </g>
</svg>
