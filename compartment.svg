<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="csTitle csDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="csTitle">Why closing a swollen limb under tension destroys muscle</title>
  <desc id="csDesc">Three cross-sections of a forearm. Normally muscle sits in a compartment wrapped in a tough sheet of fascia, with small vessels running through it and room to swell. When an injured limb is stitched closed under tension, swelling has nowhere to go, pressure rises inside the closed space and squeezes the small vessels shut, so the muscle loses its blood supply. The dead muscle then shrinks into scar and pulls the wrist and fingers into a fixed bent position.</desc>

  <defs>
    <marker id="press" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <style>
      .skin    { fill: #f4e3d8; stroke: #0c1a22; stroke-width: 2.4; }
      .fascia  { fill: none; stroke: #0c1a22; stroke-width: 3; }
      .muscle  { fill: #c98b83; stroke: #8d5852; stroke-width: 1.8; }
      .muscle2 { fill: #b06b62; stroke: #7d4a44; stroke-width: 1.8; }
      .dead    { fill: #9b9188; stroke: #6f665e; stroke-width: 1.8; }
      .vessel  { fill: #b0413e; }
      .shut    { fill: none; stroke: #6f665e; stroke-width: 1.6; }
      .bone    { fill: #efe9dc; stroke: #0c1a22; stroke-width: 1.8; }
      .suture  { stroke: #0c1a22; stroke-width: 1.8; fill: none; }
      .arrow   { stroke: #a8451a; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .step    { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag     { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagr    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .sub     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#fffefb"/>

  <!-- 1. normal -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="34">1 &#183; Room to swell</text>

    <circle class="skin" cx="112" cy="158" r="82"/>
    <circle class="fascia" cx="112" cy="158" r="66"/>
    <circle class="muscle" cx="88" cy="132" r="30"/>
    <circle class="muscle" cx="140" cy="140" r="26"/>
    <circle class="muscle2" cx="104" cy="192" r="28"/>
    <circle class="bone" cx="152" cy="190" r="18"/>
    <g class="vessel">
      <circle cx="88" cy="132" r="4"/><circle cx="140" cy="140" r="4"/>
      <circle cx="104" cy="192" r="4"/><circle cx="76" cy="160" r="3"/>
      <circle cx="126" cy="168" r="3"/>
    </g>

    <text class="tag" x="196" y="120">fascia</text>
    <text class="tag" x="188" y="212">open vessels</text>

    <text class="sub" x="0" y="290">Muscle sits inside a tough sheath</text>
    <text class="sub" x="0" y="309">with small vessels running through it,</text>
    <text class="sub" x="0" y="328">and a little room to spare.</text>
  </g>

  <!-- 2. closed under tension -->
  <g transform="translate(330,0)">
    <text class="step" x="0" y="34">2 &#183; Closed too tight</text>

    <circle class="skin" cx="112" cy="158" r="82"/>
    <circle class="fascia" cx="112" cy="158" r="66"/>
    <circle class="muscle2" cx="90" cy="130" r="34"/>
    <circle class="muscle2" cx="142" cy="140" r="30"/>
    <circle class="muscle2" cx="104" cy="194" r="32"/>
    <circle class="bone" cx="154" cy="192" r="16"/>
    <g class="shut">
      <path d="M 86 128 l 8 8 M 94 128 l -8 8"/>
      <path d="M 138 138 l 8 8 M 146 138 l -8 8"/>
      <path d="M 100 192 l 8 8 M 108 192 l -8 8"/>
    </g>
    <g class="suture">
      <path d="M 112 70 l -12 8 M 112 78 l 12 8"/>
      <path d="M 112 238 l -12 8 M 112 246 l 12 8"/>
      <path d="M 30 158 l 8 -12 M 38 158 l -8 12"/>
      <path d="M 186 158 l 8 -12 M 194 158 l -8 12"/>
    </g>
    <path class="arrow" d="M 112 40 L 112 66" marker-end="url(#press)"/>
    <path class="arrow" d="M 112 276 L 112 250" marker-end="url(#press)"/>
    <path class="arrow" d="M 4 158 L 26 158" marker-end="url(#press)"/>
    <path class="arrow" d="M 220 158 L 198 158" marker-end="url(#press)"/>
    <text class="tagr" x="198" y="212">vessels squeezed shut</text>

    <text class="sub" x="0" y="290">Stitched shut over swollen tissue,</text>
    <text class="sub" x="0" y="309">pressure climbs inside a space that</text>
    <text class="sub" x="0" y="328">cannot expand, and flow stops.</text>
  </g>

  <!-- 3. contracture -->
  <g transform="translate(620,0)">
    <text class="step" x="0" y="34">3 &#183; Muscle turns to scar</text>

    <circle class="skin" cx="112" cy="158" r="82"/>
    <circle class="fascia" cx="112" cy="158" r="66"/>
    <circle class="dead" cx="92" cy="136" r="24"/>
    <circle class="dead" cx="138" cy="146" r="20"/>
    <circle class="dead" cx="104" cy="190" r="22"/>
    <circle class="bone" cx="152" cy="188" r="18"/>

    <path class="dead" d="M 44 262 q 26 -16 54 -6 q 24 8 22 26 q -2 16 -22 14 q -18 -2 -22 -14"
          transform="translate(28,44) scale(1.05)"/>
    <text class="tag" x="60" y="356">fixed bend, permanent</text>

    <text class="sub" x="0" y="290">Dead muscle is replaced by scar,</text>
    <text class="sub" x="0" y="309">which shortens and pulls the wrist</text>
    <text class="sub" x="0" y="328">and fingers into a fixed claw.</text>
  </g>
</svg>
