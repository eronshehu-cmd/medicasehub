name: Rebuild index, archive and sitemap

on:
  push:
    branches: [main]
    paths:
      - 'case-*.html'
      - '*.svg'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "medicasehub-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- index.html cases.html sitemap.xml; then
            echo "nothing to update"
            exit 0
          fi
          git add index.html cases.html sitemap.xml
          git commit -m "Rebuild listings and sitemap [skip ci]"
          git push
