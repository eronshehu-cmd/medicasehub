<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="wmTitle wmDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="wmTitle">Why a hand cannot be pulled back out of a grinder</title>
  <desc id="wmDesc">Three cut-away views of a meat grinder barrel. First, the screw inside turns and drives everything in one direction, toward the cutting plate. Second, a hand drawn in by that screw cannot be pulled back, because the angled flights bind harder the more it is pulled. Third, the only two ways out are to turn the screw backwards or to cut the metal barrel apart.</desc>

  <defs>
    <marker id="fwd2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a1f33"/>
    </marker>
    <marker id="bad2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <marker id="ok2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a73"/>
    </marker>
    <style>
      .barrel { fill: #eceae4; stroke: #0c1a22; stroke-width: 2.4; stroke-linejoin: round; }
      .bore   { fill: #fffefb; stroke: #0c1a22; stroke-width: 1.8; }
      .shaft  { fill: #c9c4b8; stroke: #0c1a22; stroke-width: 1.8; }
      .flight { fill: #b9b2a2; stroke: #0c1a22; stroke-width: 1.6; }
      .plate  { fill: #d8d3c6; stroke: #0c1a22; stroke-width: 2; }
      .arm    { fill: #f0dcd0; stroke: #0c1a22; stroke-width: 2; }
      .pull   { stroke: #a8451a; stroke-width: 3; fill: none; stroke-linecap: round; }
      .good   { stroke: #0f7a73; stroke-width: 3; fill: none; stroke-linecap: round; }
      .cut    { stroke: #0f7a73; stroke-width: 2.6; stroke-dasharray: 8 5; fill: none; }
      .blockx { stroke: #a8451a; stroke-width: 4; stroke-linecap: round; }
      .step   { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagr   { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .tagg   { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #0f7a73; }
      .sub    { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
    </style>
  </defs>

  <rect width="880" height="400" fill="#fffefb"/>

  <!-- STAGE 1 -->
  <g transform="translate(30,0)">
    <text class="step" x="0" y="34">1 &#183; One direction only</text>

    <rect class="barrel" x="0" y="96" width="230" height="96" rx="6"/>
    <rect class="bore" x="10" y="108" width="196" height="72"/>
    <rect class="shaft" x="14" y="134" width="188" height="20" rx="8"/>
    <g class="flight">
      <path d="M 30 110 L 46 110 L 34 178 L 18 178 Z"/>
      <path d="M 74 110 L 90 110 L 78 178 L 62 178 Z"/>
      <path d="M 118 110 L 134 110 L 122 178 L 106 178 Z"/>
      <path d="M 162 110 L 178 110 L 166 178 L 150 178 Z"/>
    </g>
    <rect class="plate" x="206" y="102" width="16" height="84" rx="3"/>

    <path class="pull" stroke="#0c1a22" d="M 26 210 L 196 210" marker-end="url(#fwd2)"/>
    <text class="tag" x="60" y="234">everything travels this way</text>
    <text class="tag" x="196" y="96">plate</text>

    <text class="sub" x="0" y="290">A turning screw with angled flights.</text>
    <text class="sub" x="0" y="309">Each turn drives whatever is inside</text>
    <text class="sub" x="0" y="328">toward the cutting plate.</text>
  </g>

  <!-- STAGE 2 -->
  <g transform="translate(320,0)">
    <text class="step" x="0" y="34">2 &#183; Pulling makes it worse</text>

    <rect class="barrel" x="0" y="96" width="230" height="96" rx="6"/>
    <rect class="bore" x="10" y="108" width="196" height="72"/>
    <rect class="shaft" x="14" y="134" width="188" height="20" rx="8"/>
    <g class="flight">
      <path d="M 74 110 L 90 110 L 78 178 L 62 178 Z"/>
      <path d="M 118 110 L 134 110 L 122 178 L 106 178 Z"/>
      <path d="M 162 110 L 178 110 L 166 178 L 150 178 Z"/>
    </g>
    <path class="arm" d="M -30 122 L 96 128 L 96 160 L -30 166 Z"/>
    <text class="tag" x="-28" y="112">hand and forearm</text>

    <path class="pull" d="M 40 214 L -18 214" marker-end="url(#bad2)"/>
    <path class="blockx" d="M 58 202 L 76 226 M 76 202 L 58 226"/>
    <text class="tagr" x="90" y="220">binds harder</text>

    <text class="sub" x="0" y="290">The flights are angled. Pulling back</text>
    <text class="sub" x="0" y="309">wedges tissue against them, so force</text>
    <text class="sub" x="0" y="328">tightens the grip instead of freeing it.</text>
  </g>

  <!-- STAGE 3 -->
  <g transform="translate(620,0)">
    <text class="step" x="0" y="34">3 &#183; Two ways out</text>

    <rect class="barrel" x="0" y="96" width="230" height="96" rx="6"/>
    <rect class="bore" x="10" y="108" width="196" height="72"/>
    <rect class="shaft" x="14" y="134" width="188" height="20" rx="8"/>
    <g class="flight">
      <path d="M 74 110 L 90 110 L 78 178 L 62 178 Z"/>
      <path d="M 118 110 L 134 110 L 122 178 L 106 178 Z"/>
    </g>

    <path class="good" d="M 150 132 A 22 22 0 1 0 150 156" marker-end="url(#ok2)"/>
    <text class="tagg" x="150" y="196">turn it backwards</text>

    <path class="cut" d="M 42 84 L 42 204"/>
    <path class="cut" d="M 196 84 L 196 204"/>
    <text class="tagg" x="6" y="76">or cut the barrel</text>

    <text class="sub" x="0" y="290">Reverse the screw and the hand comes</text>
    <text class="sub" x="0" y="309">back the way it went in. If the screw is</text>
    <text class="sub" x="0" y="328">locked, the metal has to be cut instead.</text>
  </g>
</svg>
