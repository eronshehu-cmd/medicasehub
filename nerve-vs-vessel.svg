<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="nvTitle nvDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="nvTitle">Why a nerve cannot be cast</title>
  <desc id="nvDesc">Three cross-sections. An artery is a tube with a hollow channel, so resin can be injected to fill it and later reveal its shape. A nerve is solid all the way through, packed with bundles of fibres, so there is nothing to inject. The only way to isolate a nerve is therefore to cut away every other tissue around it by hand, without damaging the nerve itself.</desc>

  <defs>
    <marker id="flow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0413e"/>
    </marker>
    <style>
      .wall    { fill: #f0d9d4; stroke: #0a1f33; stroke-width: 2.4; }
      .lumen   { fill: #b0413e; fill-opacity: 0.75; stroke: #b0413e; stroke-width: 2; }
      .epi     { fill: #e8e2d2; stroke: #0a1f33; stroke-width: 2.4; }
      .fasc    { fill: #d8cbb0; stroke: #6b6047; stroke-width: 1.8; }
      .fibre   { fill: #9a8c6b; }
      .tissue  { fill: #f3ece4; stroke: #b9b0a4; stroke-width: 1.8; stroke-dasharray: 5 4; }
      .blade   { stroke: #0a1f33; stroke-width: 2.4; fill: #dfe6ec; }
      .blockx  { stroke: #b0413e; stroke-width: 4; stroke-linecap: round; }
      .step    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; fill: #0a1f33; }
      .tag     { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #3d6485; }
      .tagr    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #b0413e; }
      .sub     { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #12395c; }
    </style>
  </defs>

  <rect width="860" height="400" fill="#ffffff"/>

  <!-- PANEL A : artery -->
  <g transform="translate(40,0)">
    <text class="step" x="0" y="36">Artery</text>

    <circle class="wall" cx="110" cy="150" r="76"/>
    <circle class="lumen" cx="110" cy="150" r="48"/>

    <path stroke="#b0413e" stroke-width="3" fill="none" d="M -14 150 L 48 150" marker-end="url(#flow2)"/>
    <text class="tagr" x="-16" y="134">resin</text>
    <text class="tag" x="86" y="246">hollow</text>

    <text class="sub" x="0" y="292">A tube with a space inside it.</text>
    <text class="sub" x="0" y="311">Fill the space, dissolve the rest,</text>
    <text class="sub" x="0" y="330">and the shape survives.</text>
  </g>

  <!-- PANEL B : nerve -->
  <g transform="translate(320,0)">
    <text class="step" x="0" y="36">Nerve</text>

    <circle class="epi" cx="110" cy="150" r="76"/>
    <circle class="fasc" cx="82" cy="120" r="24"/>
    <circle class="fasc" cx="138" cy="116" r="20"/>
    <circle class="fasc" cx="74" cy="176" r="21"/>
    <circle class="fasc" cx="128" cy="172" r="26"/>
    <circle class="fasc" cx="112" cy="146" r="13"/>
    <g class="fibre">
      <circle cx="76" cy="114" r="2.6"/><circle cx="88" cy="122" r="2.6"/><circle cx="80" cy="128" r="2.6"/>
      <circle cx="134" cy="110" r="2.6"/><circle cx="144" cy="120" r="2.6"/>
      <circle cx="70" cy="172" r="2.6"/><circle cx="80" cy="180" r="2.6"/>
      <circle cx="122" cy="166" r="2.6"/><circle cx="134" cy="176" r="2.6"/>
    </g>

    <path stroke="#b0413e" stroke-width="3" fill="none" d="M -14 150 L 24 150"/>
    <path class="blockx" d="M 26 138 L 44 162 M 44 138 L 26 162"/>
    <text class="tagr" x="-16" y="134">resin</text>
    <text class="tag" x="88" y="246">solid</text>

    <text class="sub" x="0" y="292">Bundles of fibres packed in</text>
    <text class="sub" x="0" y="311">connective tissue, all the way</text>
    <text class="sub" x="0" y="330">through. Nothing to fill.</text>
  </g>

  <!-- PANEL C : subtraction -->
  <g transform="translate(600,0)">
    <text class="step" x="0" y="36">The only method</text>

    <rect class="tissue" x="20" y="74" width="180" height="152" rx="6"/>
    <circle class="epi" cx="110" cy="150" r="42"/>
    <circle class="fasc" cx="96" cy="136" r="14"/>
    <circle class="fasc" cx="124" cy="140" r="12"/>
    <circle class="fasc" cx="104" cy="166" r="13"/>

    <path class="blade" d="M 176 62 L 196 62 L 196 106 L 186 122 L 176 106 Z"/>
    <path stroke="#0a1f33" stroke-width="1.6" fill="none" d="M 186 122 L 158 148"/>

    <text class="tag" x="14" y="246">everything else cut away</text>

    <text class="sub" x="0" y="292">Remove every surrounding tissue</text>
    <text class="sub" x="0" y="311">by hand, without nicking the thing</text>
    <text class="sub" x="0" y="330">you are trying to keep.</text>
  </g>
</svg>
