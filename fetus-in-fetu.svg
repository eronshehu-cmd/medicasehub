<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="ffTitle ffDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ffTitle">Why the same mass is survivable in one place and fatal in another</title>
  <desc id="ffDesc">Two cross-sections compared. In the abdomen, where four out of five of these masses occur, the wall stretches outward as the mass grows and the organs are pushed aside rather than crushed. Inside the skull nothing can stretch, so every millimetre the mass gains is taken directly from the brain, which is compressed against bone that will not move.</desc>

  <defs>
    <marker id="push2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f7a73"/>
    </marker>
    <marker id="crush" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8451a"/>
    </marker>
    <style>
      .wall    { fill: #f4e3d8; stroke: #0c1a22; stroke-width: 2.4; }
      .was     { fill: none; stroke: #b9b0a4; stroke-width: 2; stroke-dasharray: 6 5; }
      .bone    { fill: #f0e9dc; stroke: #0c1a22; stroke-width: 3.4; }
      .organ   { fill: #d9b9a4; stroke: #a07c63; stroke-width: 1.6; }
      .brain   { fill: #e2ddd2; stroke: #9aa0a4; stroke-width: 1.6; }
      .mass    { fill: #c7b39c; stroke: #0c1a22; stroke-width: 2.2; }
      .grow    { stroke: #0f7a73; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .press   { stroke: #a8451a; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .step    { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #0c1a22; }
      .tag     { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #6c7c85; }
      .tagg    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #0f7a73; }
      .tagr    { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .06em; fill: #a8451a; }
      .sub     { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #41525c; }
      .big     { font-family: 'Newsreader', Georgia, serif; font-size: 26px; fill: #0c1a22; }
    </style>
  </defs>

  <rect width="860" height="400" fill="#fffefb"/>

  <!-- abdomen -->
  <g transform="translate(60,0)">
    <text class="step" x="0" y="34">In the abdomen</text>
    <text class="big" x="0" y="72">4 in 5 of them</text>

    <ellipse class="was" cx="140" cy="200" rx="92" ry="74"/>
    <ellipse class="wall" cx="140" cy="200" rx="116" ry="92"/>
    <circle class="mass" cx="140" cy="200" r="52"/>
    <ellipse class="organ" cx="56" cy="180" rx="22" ry="30"/>
    <ellipse class="organ" cx="224" cy="184" rx="20" ry="28"/>
    <ellipse class="organ" cx="140" cy="276" rx="34" ry="14"/>

    <path class="grow" d="M 258 200 L 286 200" marker-end="url(#push2)"/>
    <path class="grow" d="M 22 200 L -6 200" marker-end="url(#push2)"/>
    <text class="tagg" x="200" y="112">the wall stretches</text>

    <text class="sub" x="0" y="320">Soft tissue gives way. Organs are</text>
    <text class="sub" x="0" y="339">pushed aside rather than crushed,</text>
    <text class="sub" x="0" y="358">and removal usually cures it.</text>
  </g>

  <!-- skull -->
  <g transform="translate(470,0)">
    <text class="step" x="0" y="34">Inside the skull</text>
    <text class="big" x="0" y="72">almost always fatal</text>

    <circle class="bone" cx="140" cy="200" r="100"/>
    <circle class="brain" cx="140" cy="200" r="90"/>
    <circle class="mass" cx="140" cy="200" r="72"/>

    <path class="press" d="M 140 78 L 140 112" marker-end="url(#crush)"/>
    <path class="press" d="M 140 322 L 140 288" marker-end="url(#crush)"/>
    <path class="press" d="M 18 200 L 52 200" marker-end="url(#crush)"/>
    <path class="press" d="M 262 200 L 228 200" marker-end="url(#crush)"/>

    <text class="tagr" x="196" y="112">bone will not move</text>
    <text class="tag" x="0" y="128">brain, compressed</text>

    <text class="sub" x="0" y="320">Nothing here can expand. Every</text>
    <text class="sub" x="0" y="339">millimetre the mass gains is taken</text>
    <text class="sub" x="0" y="358">straight out of the brain.</text>
  </g>
</svg>
