<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="elTitle elDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="elTitle">Why eyelids protect sight</title>
  <desc id="elDesc">Two eyes compared. On the left, working eyelids sweep a film of tears across the clear front window of the eye every few seconds, keeping it wet and transparent. On the right, with no eyelids the surface is permanently exposed, dries out, and slowly becomes cloudy and scarred, which causes blindness even though the eye itself was never burned.</desc>

  <defs>
    <marker id="sweep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5c8a"/>
    </marker>
    <pattern id="scar" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9aa39a" stroke-width="2.4"/>
    </pattern>
    <style>
      .sclera { fill: #fbfcfd; stroke: #0a1f33; stroke-width: 2.4; stroke-linejoin: round; }
      .iris   { fill: #6f8ba0; stroke: #0a1f33; stroke-width: 1.8; }
      .clear  { fill: #cfe6ef; fill-opacity: 0.55; stroke: #2b5c8a; stroke-width: 1.6; }
      .dry    { fill: url(#scar); stroke: #7c8a7c; stroke-width: 1.8; }
      .lid    { fill: #f2d9cd; stroke: #0a1f33; stroke-width: 2.4; stroke-linejoin: round; }
      .tear   { stroke: #2b5c8a; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .step   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; fill: #0a1f33; }
      .tag    { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #3d6485; }
      .tagr   { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #b0413e; }
      .sub    { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #12395c; }
    </style>
  </defs>

  <rect width="840" height="400" fill="#ffffff"/>

  <!-- PANEL A : with eyelids -->
  <g transform="translate(60,0)">
    <text class="step" x="0" y="38">With eyelids</text>

    <path class="sclera" d="M 20 160 Q 140 76 260 160 Q 140 244 20 160 Z"/>
    <circle class="iris" cx="140" cy="160" r="46"/>
    <circle cx="140" cy="160" r="22" fill="#12232e"/>
    <path class="clear" d="M 20 160 Q 140 76 260 160 Q 140 244 20 160 Z"/>

    <path class="lid" d="M 20 160 Q 140 60 260 160 Q 140 108 20 160 Z"/>

    <path class="tear" d="M 62 128 L 218 128" marker-end="url(#sweep)"/>
    <text class="tag" x="76" y="112">tears spread across</text>

    <text class="sub" x="0" y="300">A blink every few seconds wipes a</text>
    <text class="sub" x="0" y="319">film of tears over the clear window</text>
    <text class="sub" x="0" y="338">at the front of the eye.</text>
    <text class="sub" x="0" y="366">It stays wet, so it stays transparent.</text>
  </g>

  <!-- PANEL B : without eyelids -->
  <g transform="translate(460,0)">
    <text class="step" x="0" y="38">Without eyelids</text>

    <path class="sclera" d="M 20 160 Q 140 76 260 160 Q 140 244 20 160 Z"/>
    <circle class="iris" cx="140" cy="160" r="46"/>
    <circle cx="140" cy="160" r="22" fill="#12232e"/>
    <path class="dry" d="M 20 160 Q 140 76 260 160 Q 140 244 20 160 Z" fill-opacity="0.75"/>

    <text class="tagr" x="52" y="108">nothing closes over it</text>
    <text class="tagr" x="60" y="272">surface dries and scars</text>

    <text class="sub" x="0" y="300">Permanently open, the surface dries.</text>
    <text class="sub" x="0" y="319">A dry cornea clouds over and scars,</text>
    <text class="sub" x="0" y="338">and the scarring is not reversible.</text>
    <text class="sub" x="0" y="366">The eye works. The view is gone.</text>
  </g>
</svg>
